name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy MIPC App
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Cargar NVM y Node.js
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Verificar que Node y npm estén disponibles
            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"

            cd ${{ secrets.DEPLOY_PATH }} || exit 1

            # Cualquier paso que falle corta el deploy y vuelve al build
            # anterior, para no dejar la app sin .next o con uno a medias.
            fallar() {
              echo "❌ $1"
              if [ -d ".next.backup" ]; then
                echo "🔄 Restoring previous build..."
                rm -rf .next
                mv .next.backup .next
                pm2 reload mipc-app --update-env || pm2 restart mipc-app
              fi
              exit 1
            }

            # Esta carpeta solo la actualiza el deploy. Con cambios sin
            # commitear, git pull falla y se desplegaría el código viejo.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "❌ La carpeta de producción tiene cambios sin commitear. Commitéalos o descártalos y vuelve a desplegar:"
              git status --short --untracked-files=no
              exit 1
            fi

            # Backup del build anterior
            if [ -d ".next" ]; then
              rm -rf .next.backup
              mv .next .next.backup
            fi

            echo "📥 Pulling latest code..."
            git pull --ff-only origin main || fallar "git pull failed"

            echo "📦 Installing dependencies..."
            npm i || fallar "npm i failed"

            # Next crea .next al empezar: se revisa el código de salida y el
            # BUILD_ID, que solo existe si el build terminó
            echo "🔨 Building application..."
            npm run build || fallar "Build failed"
            [ -f ".next/BUILD_ID" ] || fallar "Build failed: .next/BUILD_ID not found"

            echo "✅ Build completed successfully"

            # Reiniciar PM2
            echo "🔄 Restarting application..."
            pm2 reload mipc-app --update-env || pm2 restart mipc-app || fallar "Could not restart the app"

            # Guardar estado
            pm2 save

            # Limpiar backup antiguo solo si todo salió bien
            rm -rf .next.backup

            echo "✅ Deployment completed!"

      - name: Verify Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Cargar NVM y Node.js
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "⏳ Waiting for application to start..."
            sleep 15

            echo "📊 PM2 Status:"
            pm2 status mipc-app

            echo ""
            echo "📝 Recent logs:"
            pm2 logs mipc-app --lines 30 --nostream

            echo ""
            echo "🔍 Checking if app is responding..."
            pm2 jlist | grep -A 10 "mipc-app" | grep "status" | grep "online" && echo "✅ App is online" || echo "❌ App is not online"
